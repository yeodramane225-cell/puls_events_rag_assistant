stages:
  - build
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  MISTRAL_API_KEY: "$MISTRAL_API_KEY"

cache:
  paths:
    - .cache/pip

build_faiss:
  stage: build
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python src/vectorization/build_faiss_index.py
  artifacts:
    paths:
      - data/vectorstore/
    expire_in: 1 week

test_rag_pipeline:
  stage: test
  image: python:3.11
  dependencies:
    - build_faiss
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest --maxfail=1 --disable-warnings -q
